name: Tenant and document runtime verification
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: akaiv-saas
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: akaiv_test
          POSTGRES_USER: akaiv
          POSTGRES_PASSWORD: akaiv
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U akaiv -d akaiv_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      clamav:
        image: clamav/clamav:stable
        ports: ['3310:3310']
        options: >-
          --health-cmd "clamdscan --ping 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      AKAIV_SERVICE_TESTS: '1'
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: 3310
      PULSE_ENABLED: 'false'
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: akaiv_test
      DB_USERNAME: akaiv
      DB_PASSWORD: akaiv
      REDIS_HOST: 127.0.0.1
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      CACHE_STORE: array
      SCOUT_DRIVER: collection
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_pgsql, pdo_sqlite, bcmath, exif, pcntl, zip, gd, redis, sockets
          coverage: none
      - name: Install document tools and generate PDF fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr poppler-utils python3-reportlab
          /usr/bin/python3 - <<'PY'
          from reportlab.pdfgen import canvas
          pdf = canvas.Canvas('/tmp/akaiv-runtime.pdf')
          pdf.setFont('Helvetica', 28)
          pdf.drawString(60, 700, 'AKAIV COURT RECORD')
          pdf.showPage()
          pdf.setFont('Helvetica', 28)
          pdf.drawString(60, 700, 'SECOND PAGE EVIDENCE')
          pdf.save()
          PY
      - name: Create runtime directories
        run: mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare isolated environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Check remediation style
        run: |
          vendor/bin/pint app/Concerns/BelongsToOrganization.php app/Models/User.php app/Models/Document.php app/Policies/DocumentPolicy.php app/Jobs/VirusScanDocumentJob.php app/Jobs/OcrDocumentJob.php app/Jobs/IndexDocumentJob.php app/Http/Controllers/PreviewDocumentController.php app/Http/Controllers/DownloadDocumentController.php app/Console/Commands/MigrateLegacyDocumentsCommand.php app/Observers/DocumentObserver.php tests/Feature/TenantIsolationTest.php tests/Feature/DocumentPipelineTest.php tests/Feature/DocumentServicesRuntimeTest.php tests/Feature/MigrateLegacyDocumentsCommandTest.php tests/Unit/DocumentPolicyTest.php tests/Feature/PreviewDocumentTest.php
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = ["app/Concerns/BelongsToOrganization.php","app/Models/User.php","app/Models/Document.php","app/Policies/DocumentPolicy.php","app/Jobs/VirusScanDocumentJob.php","app/Jobs/OcrDocumentJob.php","app/Jobs/IndexDocumentJob.php","app/Http/Controllers/PreviewDocumentController.php","app/Http/Controllers/DownloadDocumentController.php","app/Console/Commands/MigrateLegacyDocumentsCommand.php","app/Observers/DocumentObserver.php","tests/Feature/TenantIsolationTest.php","tests/Feature/DocumentPipelineTest.php","tests/Feature/DocumentServicesRuntimeTest.php","tests/Feature/MigrateLegacyDocumentsCommandTest.php","tests/Unit/DocumentPolicyTest.php","tests/Feature/PreviewDocumentTest.php"]
          print('AKAIV_FORMATTED=' + json.dumps({p: Path(p).read_text() for p in paths}))
          PY
          git diff --exit-code -- app/Concerns/BelongsToOrganization.php app/Models/User.php app/Models/Document.php app/Policies/DocumentPolicy.php app/Jobs/VirusScanDocumentJob.php app/Jobs/OcrDocumentJob.php app/Jobs/IndexDocumentJob.php app/Http/Controllers/PreviewDocumentController.php app/Http/Controllers/DownloadDocumentController.php app/Console/Commands/MigrateLegacyDocumentsCommand.php app/Observers/DocumentObserver.php tests/Feature/TenantIsolationTest.php tests/Feature/DocumentPipelineTest.php tests/Feature/DocumentServicesRuntimeTest.php tests/Feature/MigrateLegacyDocumentsCommandTest.php tests/Unit/DocumentPolicyTest.php tests/Feature/PreviewDocumentTest.php
      - name: Run tenant and document runtime tests
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/pest --colors=never --log-junit runtime-verification.xml | tee runtime-verification.log
      - name: Show import failure diagnostics
        if: failure()
        run: find storage/logs -name 'migration-failures-*.csv' -exec cat {} +
      - name: Preserve verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-document-runtime-results
          path: |
            akaiv-saas/runtime-verification.xml
            akaiv-saas/runtime-verification.log
